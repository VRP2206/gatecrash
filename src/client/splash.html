<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gatecrash</title>
  </head>
  <body class="splash-body">
    <main class="splash" id="splash">
      <svg class="splash-art" viewBox="0 0 400 512" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g class="art-traces">
          <path d="M-10 292H108l40-40h104l40 40h118" />
          <path d="M410 70h-78l-36 36v76" />
          <path d="M292 292v76l38 38h80" />
          <path d="M148 252v-52" />
          <path d="M252 252v-36l22-22" />
        </g>
        <g class="art-hot">
          <path d="M-10 292H108l40-40h104l40 40h118" />
          <path d="M410 70h-78l-36 36v76" />
        </g>
        <g class="art-pads">
          <circle cx="148" cy="200" r="5" />
          <circle cx="296" cy="182" r="5" />
          <circle cx="292" cy="292" r="5" />
          <circle cx="108" cy="292" r="5" />
          <circle cx="274" cy="194" r="5" />
          <circle cx="330" cy="406" r="5" />
        </g>
        <g class="art-holes">
          <circle cx="18" cy="18" r="6" />
          <circle cx="382" cy="18" r="6" />
          <circle cx="18" cy="494" r="6" />
          <circle cx="382" cy="494" r="6" />
        </g>
      </svg>

      <div class="splash-copy">
        <p class="silk" id="meta">Daily circuit puzzle</p>
        <h1 class="display splash-title">Gate<wbr />crash</h1>
        <p class="splash-pitch">Fit the chips. Light the bulbs. Spend as few charges as you can.</p>
      </div>

      <div class="splash-foot">
        <p class="splash-streak" id="streak" hidden></p>
        <button type="button" class="btn splash-play" id="play">Play</button>
        <p class="silk splash-note" id="note">One new board every day</p>
      </div>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
